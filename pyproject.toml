[project]
name = "election-data-grabber"
version = "0.1.0"
description = "Discover, snapshot, normalize, and diff local election-results sources."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "pydantic>=2.7",
  "typer>=0.12",
  "pypdf>=5.0",
]

[project.optional-dependencies]
clarity = ["clarify>=0.7"]
pdf_tables = ["pdfplumber>=0.11"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
election-grab = "election_data_grabber.cli:app"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
