name: Wisconsin one-cut roster ingestion
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: national-100pct-starting-point-coverage
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e '.[dev]'
      - name: Ingest Wisconsin LTSB roster
        run: python scripts/ingest_wisconsin_ltsb_roster.py
      - name: Regenerate tracker and audit
        run: |
          python scripts/generate_locality_coverage_tracker.py
          python -m scripts.audit_national_starting_point_coverage
      - name: Commit bounded import
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add registry/us_primary_election_localities.csv registry/us_primary_election_locality_denominators.csv registry/us_local_unit_coverage_tracker.csv
          git diff --cached --quiet && exit 0
          git commit -m 'Import WI LTSB official municipality candidates'
          git push origin HEAD:national-100pct-starting-point-coverage
