name: Election-night collector readiness
on:
  pull_request:
    paths:
      - 'src/election_data_grabber/**'
      - 'tests/test_election_night.py'
      - 'config/**'
      - 'registry/**'
      - '.github/workflows/election-night-readiness.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: election-night-readiness-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e '.[dev]'
      - name: Collector and identity rehearsal (no live network)
        run: pytest -q tests/test_election_night.py tests/test_washtenaw_adapter.py tests/test_washtenaw_live_summary.py tests/test_reporting_topology_integration.py tests/test_five_state_replay.py
      - run: ruff check src/election_data_grabber/election_refresh.py src/election_data_grabber/election_night.py src/election_data_grabber/election_readiness.py src/election_data_grabber/cli.py src/election_data_grabber/adapters/washtenaw.py tests/test_election_night.py
      - name: Build honest readiness evidence
        run: election-grab readiness --state-dir /tmp/election-readiness-state
      - uses: actions/upload-artifact@v4
        with:
          name: election-night-readiness
          path: audit/election-night-readiness/
