name: Maine end-to-end portability audit
on:
  pull_request:
    paths:
      - "registry/me_locality_authorities.csv"
      - "registry/me_locality_capabilities.csv"
      - "scripts/audit_maine_end_to_end.py"
      - "src/election_data_grabber/source_reliability.py"
      - "tests/test_source_reliability.py"
      - "scripts/triage_maine_pending.py"
      - "tests/test_maine_end_to_end_audit.py"
      - ".github/workflows/me-end-to-end-audit.yml"
  workflow_dispatch:
  schedule:
    - cron: "23 7 * * *"

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
      - run: pip install -e '.[dev]'
      - run: pytest -q tests/test_maine_end_to_end_audit.py tests/test_source_reliability.py tests/test_artifact_auditor.py tests/test_authority_resolver.py tests/test_me_d_families.py

  audit:
    needs: validate
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
      - run: pip install -e .
      - name: Restore previous source ledger\n        env:\n          GH_TOKEN: ${{ github.token }}\n        run: |\n          mkdir -p audit\n          previous_run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "me-end-to-end-audit.yml" --branch main --status success --limit 1 --json databaseId --jq ".[0].databaseId")\n          if [ -n "$previous_run" ]; then\n            gh run download "$previous_run" --repo "$GITHUB_REPOSITORY" --name "maine-audit-${{ matrix.shard }}" --dir previous-ledger || true\n          fi\n          if [ -f "previous-ledger/maine-source-ledger-${{ matrix.shard }}.json" ]; then\n            cp "previous-ledger/maine-source-ledger-${{ matrix.shard }}.json" "audit/previous-ledger.json"\n          fi\n      - run: mkdir -p audit && python scripts/audit_maine_end_to_end.py --shard ${{ matrix.shard }} --shards 7 --max-artifacts 2 --out audit/maine-audit-${{ matrix.shard }}.csv --summary audit/maine-summary-${{ matrix.shard }}.json --source-ledger-in audit/previous-ledger.json --source-ledger-out audit/maine-source-ledger-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maine-audit-${{ matrix.shard }}
          path: audit/
          if-no-files-found: warn
