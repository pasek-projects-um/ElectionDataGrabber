name: Michigan top county election-night fingerprints
on:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
      - run: pip install -e '.[dev]'
      - run: pytest -q tests/test_platform_adapters.py tests/test_tabulator_reports.py tests/test_mi_top10_historical_leads.py
  fingerprint:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
      - run: pip install -e .
      - name: Restore previous successful fingerprint evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p prior
          previous=$(gh run list --workflow mi-top10-election-night.yml --branch main --status success --limit 5 --json databaseId --jq ".[].databaseId" | head -n 1)
          if [ -n "$previous" ]; then
            gh run download "$previous" -n mi-top10-election-night-fingerprints -D prior || true
          fi
      - run: python scripts/mi_top10_election_night_fingerprint.py --previous prior/mi-top10-election-night-fingerprints.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mi-top10-election-night-fingerprints
          path: audit/
