name: Census county enumeration sprint
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/census-county-enumeration.yml'
      - 'scripts/expand_census_county_starts.py'
      - 'tests/test_expand_census_county_starts.py'
permissions:
  contents: write
jobs:
  expand:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: national-100pct-starting-point-coverage
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - name: Expand registry from Census if needed
        run: python scripts/expand_census_county_starts.py --min-additions 0
      - run: python scripts/generate_locality_coverage_tracker.py
      - run: python -m scripts.audit_national_starting_point_coverage
      - name: Commit verified Census names to sprint branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry/us_primary_election_localities.csv registry/us_local_unit_coverage_tracker.csv
          git diff --cached --quiet && exit 0
          git commit -m "Enumerate 1000+ additional Census-backed election jurisdiction candidates"
          git push origin HEAD:national-100pct-starting-point-coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: census-national-coverage-audit
          path: audit/national-starting-point*
