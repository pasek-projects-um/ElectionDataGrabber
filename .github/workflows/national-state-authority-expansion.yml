name: National state authority expansion
on:
  pull_request:
    paths:
      - "registry/us_state_central_authority_sources.csv"
      - "scripts/expand_state_authorities_from_central.py"
      - "src/election_data_grabber/state_expansion.py"
      - "scripts/generate_state_unit_data_access_census.py"
      - "scripts/promote_az_ky_surfaces.py"
      - "tests/test_az_ky_promotion.py"
      - "scripts/promote_ia_md_or_va_surfaces.py"
      - "tests/test_ia_md_or_va_promotion.py"
      - "scripts/promote_mo_nh_hi_nj_surfaces.py"
      - "tests/test_mo_nh_hi_nj_promotion.py"
      - "scripts/classify_mn_next_action.py"
      - "tests/test_mn_next_action.py"
      - "tests/test_national_first_pass_inventory.py"
      - "src/election_data_grabber/easy_ingest.py"
      - "scripts/build_national_easy_ingest_queue.py"
      - "tests/test_easy_ingest.py"
      - "src/election_data_grabber/supported_ingest.py"
      - "tests/test_supported_ingest.py"
      - "src/election_data_grabber/execution_maturity.py"
      - "tests/test_execution_maturity.py"
      - "src/election_data_grabber/supported_execution.py"
      - "tests/test_supported_execution.py"
      - "scripts/run_national_supported_execution.py"
      - "scripts/audit_national_promotion_gaps.py"
      - "tests/test_national_promotion_gaps.py"
      - "tests/test_national_supported_execution.py"
      - "src/election_data_grabber/adapters/generic_excel.py"
      - "tests/test_generic_excel.py"
      - "pyproject.toml"
      - "src/election_data_grabber/platform_fingerprint.py"
      - "tests/test_platform_fingerprint.py"
      - "scripts/probe_ranked_platforms.py"
      - "tests/test_ranked_platform_probe.py"
      - "registry/us_state_directory_profiles.csv"
      - ".github/workflows/national-state-authority-expansion.yml"
  workflow_dispatch:
    inputs:
      states:
        description: "Space-separated state abbreviations; blank means all"
        required: false
        type: string
jobs:
  expand:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
      - run: pip install -e '.[dev]'
      - run: pytest -q tests/test_state_directory_profiles.py tests/test_state_expansion.py tests/test_state_coverage_gap_priorities.py tests/test_az_ky_promotion.py tests/test_ia_md_or_va_promotion.py tests/test_mo_nh_hi_nj_promotion.py tests/test_mn_next_action.py tests/test_national_first_pass_inventory.py tests/test_easy_ingest.py tests/test_supported_ingest.py tests/test_execution_maturity.py tests/test_supported_execution.py tests/test_national_supported_execution.py tests/test_national_promotion_gaps.py tests/test_platform_fingerprint.py tests/test_ranked_platform_probe.py
      - name: Expand central state directories
        shell: bash
        run: |
          if [ -n "${{ inputs.states }}" ]; then
            read -r -a STATE_ARGS <<< "${{ inputs.states }}"
            python scripts/expand_state_authorities_from_central.py --states "${STATE_ARGS[@]}"
          else
            python scripts/expand_state_authorities_from_central.py
          fi
      - name: Generate state unit/access census
        run: python scripts/generate_state_unit_data_access_census.py
      - name: Prioritize coverage gaps
        run: python scripts/prioritize_state_coverage_gaps.py
      - name: Build AZ/KY promotion tranche
        run: python scripts/promote_az_ky_surfaces.py
      - name: Build IA/MD/OR/VA promotion tranche
        run: python scripts/promote_ia_md_or_va_surfaces.py
      - name: Build MO/NH/HI/NJ promotion tranche
        run: python scripts/promote_mo_nh_hi_nj_surfaces.py
      - name: Classify Minnesota next action
        run: python scripts/classify_mn_next_action.py
      - name: Build national supported-source manifest
        run: python scripts/build_national_easy_ingest_queue.py
      - name: Run supported-source national execution
        run: python scripts/run_national_supported_execution.py --timeout 10
      - name: Audit national promotion gaps
        run: python scripts/audit_national_promotion_gaps.py
      - name: Probe ranked election-result platforms
        run: python scripts/probe_ranked_platforms.py --timeout 8 --limit 25
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: national-state-authority-expansion
          path: audit/
