name: National state authority expansion
on:
  pull_request:
    paths:
      - "registry/us_state_central_authority_sources.csv"
      - "scripts/expand_state_authorities_from_central.py"
      - "src/election_data_grabber/state_expansion.py"
      - "scripts/generate_state_unit_data_access_census.py"
      - "scripts/promote_az_ky_surfaces.py"
      - "tests/test_az_ky_promotion.py"
      - "scripts/promote_ia_md_or_va_surfaces.py"
      - "tests/test_ia_md_or_va_promotion.py"
      - "registry/us_state_directory_profiles.csv"
      - ".github/workflows/national-state-authority-expansion.yml"
  workflow_dispatch:
    inputs:
      states:
        description: "Space-separated state abbreviations; blank means all"
        required: false
        type: string
jobs:
  expand:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
      - run: pip install -e '.[dev]'
      - run: pytest -q tests/test_state_directory_profiles.py tests/test_state_expansion.py tests/test_state_coverage_gap_priorities.py tests/test_az_ky_promotion.py tests/test_ia_md_or_va_promotion.py
      - name: Expand central state directories
        shell: bash
        run: |
          if [ -n "${{ inputs.states }}" ]; then
            read -r -a STATE_ARGS <<< "${{ inputs.states }}"
            python scripts/expand_state_authorities_from_central.py --states "${STATE_ARGS[@]}"
          else
            python scripts/expand_state_authorities_from_central.py
          fi
      - name: Generate state unit/access census
        run: python scripts/generate_state_unit_data_access_census.py
      - name: Prioritize coverage gaps
        run: python scripts/prioritize_state_coverage_gaps.py
      - name: Build AZ/KY promotion tranche
        run: python scripts/promote_az_ky_surfaces.py
      - name: Build IA/MD/OR/VA promotion tranche
        run: python scripts/promote_ia_md_or_va_surfaces.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: national-state-authority-expansion
          path: audit/
