name: National shared-core canaries
on:
  pull_request:
    paths:
      - "src/election_data_grabber/**"
      - "tests/test_national_canaries.py"
      - "tests/test_reporting_unit_identity.py"
      - "tests/test_reporting_topology_integration.py"
      - "tests/test_identity_aliases_vote_modes.py"
      - "tests/test_source_capabilities.py"
      - "tests/test_locality_registry.py"
      - "tests/test_*_locality_registry.py"
      - "scripts/generate_locality_coverage_tracker.py"
      - "registry/us_state_directory_profiles.csv"
      - "registry/us_primary_election_localities.csv"
      - "registry/us_primary_election_locality_denominators.csv"
      - "registry/us_local_unit_coverage_tracker.csv"
      - "registry/jurisdiction_source_capabilities.csv"
      - ".github/workflows/national-canaries.yml"
  workflow_dispatch:

jobs:
  canaries:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
      - run: pip install -e '.[dev]'
      - run: pytest -q tests/test_national_canaries.py tests/test_provenance.py tests/test_authority_identity.py tests/test_canonical_ids.py tests/test_reporting_unit_identity.py tests/test_reporting_topology_integration.py tests/test_identity_aliases_vote_modes.py tests/test_washtenaw_adapter.py tests/test_washtenaw_html_adapter.py tests/test_clarity_xml_adapter.py tests/test_platform_adapters.py tests/test_locality_registry.py tests/test_mi_oh_locality_registry.py tests/test_reconcile_local_units.py tests/test_reconcile.py tests/test_ct_pa_locality_registry.py tests/test_me_locality_registry.py tests/test_source_capabilities.py
